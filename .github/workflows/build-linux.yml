name: Build Linux

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      name:
        description: 'Version name (default is ref name)'

env:
  VERSION: ${{ github.event.inputs.name || github.ref_name }}

jobs:
  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Process Version
        run: |
          TAG_VERSION=$(echo "${{ env.VERSION }}" | sed 's/^[vV]//')
          if ! [[ $TAG_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version ${{ env.VERSION }} error."
            exit 1
          fi
          echo "GITHUB_VERSION=$TAG_VERSION" >>$GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qt5-qmake qt5-qmake-bin qtbase5-dev qtbase5-dev-tools
          sudo apt-get install -y libqt5core5a libqt5gui5 libqt5widgets5 libqt5network5 libqt5x11extras5-dev
          sudo apt-get install -y build-essential libopencv-dev libxtst-dev libxrandr-dev libx11-dev
          sudo apt-get install -y cmake
          sudo apt-get install -y wget 7z
          wget https://github.com/RapidAI/RapidOcrOnnx/releases/download/1.2.2/linux-clib.7z
          wget https://github.com/RapidAI/OnnxruntimeBuilder/releases/download/1.15.1/onnxruntime-v1.15.1-ubuntu-22.04-amd64-static.7z
          7z x linux-clib.7z
          7z x onnxruntime-v1.15.1-ubuntu-22.04-amd64-static.7z
          cp RapidOcrConfig.cmake linux-clib/Linux-CLIB-CPU
          sed -i 's|/../../onnxruntime-static/linux/OnnxRuntimeConfig.cmake|/../../linux/OnnxRuntimeConfig.cmake|g' linux-clib/Linux-CLIB-CPU/RapidOcrConfig.cmake
          find linux-clib/Linux-CLIB-CPU/include -type f -name '*.h' -exec sed -i 's|#include <onnxruntime/core/session/onnxruntime_cxx_api.h>|#include <onnxruntime_cxx_api.h>|g' {} +

      - name: Build and Package
        run: |
          ARCH=$(dpkg --print-architecture)
          BASE="screenshot-${GITHUB_VERSION}-${{ matrix.os }}-${ARCH}"
          cmake -Bbuild-tencent -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DTENCENT_OCR=ON
          cmake --build build-tencent -j$(nproc)
          cmake --build build-tencent --target package
          mv build-tencent/screenshot.deb "${BASE}-tencent.deb"
          mv build-tencent/screenshot.deb.sha256 "${BASE}-tencent.deb.sha256"
          cmake -Bbuild-tencent-rapid -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DTENCENT_OCR=ON -DRAPID_OCR=ON -DRapidOcr_DIR=./linux-clib/Linux-CLIB-CPU
          cmake --build build-tencent-rapid -j$(nproc)
          cmake --build build-tencent-rapid --target package
          mv build-tencent-rapid/screenshot.deb "${BASE}-tencent-rapid.deb"
          mv build-tencent-rapid/screenshot.deb.sha256 "${BASE}-tencent-rapid.deb.sha256"
          echo "DEB_BASE=${BASE}" >>$GITHUB_ENV
          ls

      - name: Upload deb
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DEB_BASE }}
          path: |
            screenshot-*.deb
            screenshot-*.deb.sha256

